<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#132c3b"><title>ちゅらたび｜到着ロビー・新試作</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#101e29;color:#fff;font-family:system-ui,"Hiragino Kaku Gothic ProN",sans-serif}#game{width:100vw;height:100dvh;display:block;image-rendering:pixelated;touch-action:none}#ui{position:fixed;inset:0;pointer-events:none}#top{position:absolute;top:max(12px,env(safe-area-inset-top));left:12px;right:12px;display:flex;gap:8px;align-items:flex-start;justify-content:space-between}.panel{background:#102b3de8;border:2px solid #91b5b7;border-radius:8px;box-shadow:0 4px 0 #081721;padding:8px 11px}.eyebrow{font-size:10px;letter-spacing:2px;color:#f4d394}.heading{font-size:15px;font-weight:900}.small{font-size:11px;color:#c1d9d7}#goal{max-width:225px}#hint{position:absolute;bottom:calc(17px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);white-space:nowrap;background:#122b3acb;padding:7px 12px;border-radius:18px;font-size:11px;color:#d9e7e5}#dialog{display:none;position:absolute;bottom:calc(22px + env(safe-area-inset-bottom));left:12px;right:12px;background:#f8f0d7;color:#293d46;border:4px solid #284759;border-radius:7px;box-shadow:0 7px 0 #091d29;padding:13px 16px;pointer-events:auto;min-height:124px}#who{font-size:12px;color:#aa5e3b;font-weight:900;letter-spacing:1px}#speech{font-size:15px;font-weight:750;line-height:1.65;margin:5px 0 9px}#next{float:right;border:0;background:#24576a;color:white;border-radius:5px;padding:8px 16px;font-weight:800}#start{position:absolute;inset:0;display:grid;place-items:center;background:linear-gradient(#102e42d9,#0a1d2ee8);pointer-events:auto;text-align:center;padding:22px}#start .box{width:min(400px,100%);border:3px solid #e8d29d;background:#14364c;padding:28px 18px;box-shadow:0 10px 0 #091b2a}#start h1{font-size:40px;letter-spacing:6px;color:#ffe2a5;margin:10px 0 4px;text-shadow:3px 4px #7e5e43}#start p{font-size:13px;line-height:1.9;color:#d8e8e8}#play{margin-top:16px;padding:13px 28px;background:#efc978;color:#253e47;border:0;border-bottom:5px solid #9d713f;border-radius:6px;font-size:17px;font-weight:900}#version{position:absolute;bottom:calc(7px + env(safe-area-inset-bottom));right:12px;color:#b5c4c8;font-size:10px}</style></head><body><canvas id="game"></canvas><div id="ui"><div id="top"><div class="panel"><div class="eyebrow">OKINAWA · NAHA</div><div class="heading">那覇空港 到着ロビー</div><div class="small">第一章 / めんそーれ沖縄</div></div><div class="panel" id="goal"><div class="eyebrow">NEXT OBJECTIVE</div><div class="heading" id="objective">案内係に話しかけよう</div></div></div><div id="hint">床をタップして移動 · 人をタップして会話</div><div id="dialog"><div id="who"></div><div id="speech"></div><button id="next">つづける ▸</button></div><div id="start"><div class="box"><div class="eyebrow">A LITTLE JOURNEY IN OKINAWA</div><h1>ちゅらたび</h1><div style="color:#f3b887;letter-spacing:4px;font-weight:900">那覇空港 到着編</div><p>飛行機を降りたら、そこは沖縄。<br>旅の最初の一歩を踏み出そう。</p><button id="play">旅をはじめる ▸</button><p style="font-size:11px">タップで歩く · 案内係と会話 · ゆいレールを目指す</p></div></div><div id="version">SCENE TEST 0.4 · ORIGINAL PIXEL ART</div></div><script>
(()=>{'use strict';
const canvas=document.querySelector('#game'),ctx=canvas.getContext('2d',{alpha:false});let W=360,H=640,S=2,ox=0,oy=0,cam=0,started=false,step=0,dialogQueue=[],active=false,last=0,walkT=0;
const TILE=32,MW=14,MH=29;let walls=new Set();const block=(x,y)=>walls.add(x+','+y);
const npcs=[{x:6,y:7,name:'空港案内係',color:'#e5ac79',hair:'#3d2d32',shirt:'#4a86a6',text:['めんそーれ！ 沖縄へようこそ。','ゆいレールは、到着ロビーから案内表示に沿って進んでくださいね。']},{x:10,y:13,name:'旅人',color:'#d9a278',hair:'#5b4038',shirt:'#dc946b',text:['沖縄に着いた瞬間、空気が違うね。','まずは国際通りに行ってみようかな。']},{x:4,y:19,name:'地元のおばあ',color:'#c9956f',hair:'#bcb3a5',shirt:'#a17cae',text:['はいさい。慌てず、ゆっくり楽しんでね。','沖縄の旅は、寄り道も楽しいさー。']}];
const player={x:7,y:23,px:7*32,py:23*32,dir:0};let path=[],targetNpc=null;const key=(x,y)=>x+','+y;
for(let y=0;y<MH;y++)for(let x=0;x<MW;x++)if(x===0||x===MW-1||y===0||y===MH-1)block(x,y);
for(let x=1;x<MW-1;x++){if(x<4||x>9){for(let y of [3,4,5,6,9,10,11,16,17,18,22,23,24])block(x,y)}}
for(let x=4;x<=9;x++)block(x,3);for(let x=4;x<=9;x++)block(x,26);
for(let n of npcs)block(n.x,n.y);
function resize(){let d=Math.min(devicePixelRatio||1,2);canvas.width=Math.round(innerWidth*d);canvas.height=Math.round(innerHeight*d);canvas.style.width=innerWidth+'px';canvas.style.height=innerHeight+'px';S=Math.max(1,Math.min(canvas.width/360,canvas.height/580));W=canvas.width/S;H=canvas.height/S;ox=(W-448)/2;ctx.imageSmoothingEnabled=false}addEventListener('resize',resize);resize();
function rect(x,y,w,h,c){ctx.fillStyle=c;ctx.fillRect(Math.round(x),Math.round(y),Math.ceil(w),Math.ceil(h))}
function line(x,y,w,h,c){rect(x,y,w,h,c)}
function spr(x,y,c,hair,shirt,dir=0,frame=0){x=Math.round(x);y=Math.round(y);rect(x+7,y+29,19,3,'#00000030');let leg=frame?2:0;rect(x+10,y+24,5,7+leg,'#31445c');rect(x+19,y+24+leg,5,7-leg,'#31445c');rect(x+9,y+29+leg,7,3,'#253142');rect(x+19,y+29-leg,7,3,'#253142');rect(x+7,y+15,20,13,'#23384a');rect(x+9,y+16,16,11,shirt);rect(x+5,y+18,4,8,c);rect(x+26,y+18,4,8,c);rect(x+8,y+4,19,14,'#263b4b');rect(x+9,y+5,17,13,c);rect(x+8,y+3,19,6,hair);rect(x+7,y+6,5,5,hair);rect(x+22,y+5,6,4,hair);if(dir!==2){rect(x+13,y+12,2,2,'#283642');rect(x+21,y+12,2,2,'#283642');rect(x+16,y+16,4,1,'#b97666')}else{rect(x+12,y+8,13,7,hair)}if(dir===1)rect(x+25,y+10,2,2,'#263b4b');if(dir===3)rect(x+8,y+10,2,2,'#263b4b')}
function plant(x,y){rect(x+6,y+18,20,13,'#8d604a');rect(x+8,y+20,16,8,'#bb8060');rect(x+14,y+4,4,20,'#396a4e');for(let [a,b] of [[6,7],[20,5],[4,13],[20,14],[11,2]]){rect(x+a,y+b,10,6,'#285a49');rect(x+a+2,y+b,7,4,'#4f986b')}}
function chair(x,y){rect(x+2,y+6,28,20,'#263e50');rect(x+4,y+6,24,6,'#6f9ca3');rect(x+5,y+13,22,10,'#527e88');rect(x+2,y+25,5,4,'#c8a57b');rect(x+25,y+25,5,4,'#c8a57b')}
function drawMap(){rect(0,0,448,928,'#b5c3bc');for(let y=0;y<MH;y++)for(let x=0;x<MW;x++){let a=x*TILE,b=y*TILE;rect(a,b,32,32,(x+y)%2?'#c9d2c8':'#d6dbcf');rect(a,b,32,1,'#aabcb4');rect(a,b,1,32,'#b2c1b9');if(x===0||x===13){rect(a,b,32,32,'#395b6c');rect(a+3,b+2,26,28,'#557989');rect(a+4,b+3,2,24,'#87a5a7')}if(walls.has(key(x,y))&&x>0&&x<13&&y>0&&y<28){rect(a,b,32,32,'#829c9b');rect(a,b,32,4,'#55737c');rect(a+3,b+7,26,19,'#a5b5ad')}} 
for(let y of [4,10,17,23]){rect(0,y*32,96,32,'#365d70');rect(5,y*32+4,86,22,'#7eafc1');rect(9,y*32+6,76,17,'#b3d5d5');rect(18,y*32+9,34,3,'#f4ead0')}
for(let y of [4,10,17,23]){rect(352,y*32,96,32,'#365d70');rect(357,y*32+4,86,22,'#7eafc1');rect(362,y*32+6,76,17,'#b3d5d5')}
for(let y of [9,16,22]){plant(40,y*32);plant(384,y*32)}
for(let y of [11,18]){chair(42,y*32);chair(374,y*32)}
rect(127,118,194,31,'#294c5d');rect(131,122,186,23,'#e6d9ac');rect(136,127,10,12,'#4c907f');text('到着ロビー  ARRIVALS',151,137,'#294c5d',12);
rect(133,777,182,33,'#275c67');rect(138,782,172,22,'#e8c77f');text('ゆいレール  ↑',159,797,'#274a53',14);
for(let x=4;x<=9;x++){rect(x*32,0,32,32,'#426574');rect(x*32+4,5,24,22,'#6d98a0')}
rect(159,832,128,17,'#496e70');rect(165,835,116,10,'#b3c3b6');
for(let i=0;i<9;i++){rect(140+i*19,558,9,2,'#d2bd8b')}
}
function text(t,x,y,c,size=12){ctx.fillStyle=c;ctx.font='bold '+size+'px system-ui,sans-serif';ctx.fillText(t,x,y)}
function bfs(sx,sy,tx,ty){let q=[[sx,sy]],prev=new Map([[key(sx,sy),null]]),found=false;for(let i=0;i<q.length;i++){let [x,y]=q[i];if(x===tx&&y===ty){found=true;break}for(let [dx,dy] of [[0,-1],[1,0],[0,1],[-1,0]]){let a=x+dx,b=y+dy,k=key(a,b);if(a<1||a>12||b<1||b>27||walls.has(k)||prev.has(k))continue;prev.set(k,[x,y]);q.push([a,b])}}if(!found)return[];let p=[],cur=[tx,ty];while(cur&&(cur[0]!==sx||cur[1]!==sy)){p.unshift(cur);cur=prev.get(key(...cur))}return p}
function interact(n){if(n.name==='空港案内係'&&step===0){step=1;document.querySelector('#objective').textContent='ゆいレールの案内へ進もう'}say(n.name,n.text)}
function say(who,lines){dialogQueue=lines.map(s=>[who,s]);active=true;path=[];showNext()}
function showNext(){let d=document.querySelector('#dialog');if(!dialogQueue.length){d.style.display='none';active=false;return}let [w,t]=dialogQueue.shift();document.querySelector('#who').textContent=w;document.querySelector('#speech').textContent=t;document.querySelector('#next').textContent=dialogQueue.length?'つづける ▸':'閉じる ✓';d.style.display='block'}
document.querySelector('#next').onclick=showNext;
function pointer(e){if(!started||active)return;let r=canvas.getBoundingClientRect(),x=(e.clientX-r.left)*(canvas.width/r.width)/S-ox,y=(e.clientY-r.top)*(canvas.height/r.height)/S+cam;let tx=Math.floor(x/TILE),ty=Math.floor(y/TILE);if(tx<1||tx>12||ty<1||ty>27)return;let n=npcs.find(n=>Math.abs(n.x-tx)<=0&&Math.abs(n.y-ty)<=0);if(n){let options=[[0,-1],[1,0],[0,1],[-1,0]].map(([dx,dy])=>[n.x+dx,n.y+dy]).filter(([a,b])=>!walls.has(key(a,b)));let routes=options.map(([a,b])=>bfs(player.x,player.y,a,b)).filter(p=>p.length||Math.abs(player.x-n.x)+Math.abs(player.y-n.y)===1).sort((a,b)=>a.length-b.length);if(routes.length){path=routes[0];targetNpc=n;if(!path.length)interact(n)}return}targetNpc=null;if(!walls.has(key(tx,ty)))path=bfs(player.x,player.y,tx,ty)}
canvas.addEventListener('pointerdown',pointer);
function update(dt){if(!started||active)return;let dest=path[0];if(dest){let dx=dest[0]*32-player.px,dy=dest[1]*32-player.py;let dist=Math.hypot(dx,dy),move=Math.min(dist,dt*.105);if(dist<1.5){player.px=dest[0]*32;player.py=dest[1]*32;player.x=dest[0];player.y=dest[1];path.shift();if(!path.length&&targetNpc){let n=targetNpc;targetNpc=null;interact(n)}if(!path.length&&player.y<=5&&step===1){step=2;document.querySelector('#objective').textContent='ゆいレールへ向かおう';say('旅の記録',['那覇空港の案内を確認した！','沖縄の旅が、いよいよ始まる。'])}if(!path.length&&player.y>=25&&step===2){step=3;document.querySelector('#objective').textContent='到着ロビーを探索しよう';say('旅の記録',['ゆいレールへの道を見つけた！','この先のエリアは、次の制作で追加予定です。'])}}else{player.px+=dx/dist*move;player.py+=dy/dist*move;player.dir=Math.abs(dx)>Math.abs(dy)?(dx>0?1:3):(dy>0?0:2);walkT+=dt}}}
function render(t){let dt=Math.min(45,t-last||16);last=t;update(dt);ctx.setTransform(S,0,0,S,0,0);ctx.fillStyle='#162f3c';ctx.fillRect(0,0,W,H);cam=Math.max(0,Math.min(MH*TILE-H+60,player.py-H*.58));ctx.save();ctx.translate(ox,-cam);drawMap();for(let n of npcs)spr(n.x*32,n.y*32-2,n.color,n.hair,n.shirt,0,0);spr(player.px,player.py-2,'#e4ad87','#2d343e','#f3f0df',player.dir,path.length?Math.floor(walkT/130)%2:0);if(path.length){let [x,y]=path[path.length-1];rect(x*32+12,y*32+28,8,3,'#d99e54')}ctx.restore();requestAnimationFrame(render)}requestAnimationFrame(render);
document.querySelector('#play').onclick=()=>{started=true;document.querySelector('#start').style.display='none';say('旅の記録',['那覇空港に到着！ 南国の空気が迎えてくれる。','まずは青い制服の案内係に話しかけよう。'])};
})();
</script></body></html>
