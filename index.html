function rect(x,y,w,h,c){g.fillStyle=c;g.fillRect(Math.round(x),Math.round(y),Math.ceil(w),Math.ceil(h))}function txt(s,x,y,c='#fff',size=9){g.fillStyle=c;g.font=`bold ${size}px monospace`;g.fillText(s,Math.round(x),Math.round(y))}function setTile(x,y,v){if(x>=0&&y>=0&&x<MW&&y<MH)map[y][x]=v}function area(x,y,w,h,v){for(let j=y;j<y+h;j++)for(let i=x;i<x+w;i++)setTile(i,j,v)}function add(type,x,y,opts={}){objects.push({type,x,y,...opts})}function npc(x,y,name,lines,shirt='#dca35b'){npcs.push({x,y,name,lines,shirt})}function blocked(x,y){return x<1||y<1||x>=MW-1||y>=MH-1||map[y][x]==='#'||map[y][x]==='~'||objects.some(o=>o.solid!==false&&o.x===x&&o.y===y)||npcs.some(n=>n.x===x&&n.y===y)}

if(f==='outside'){area(1,4,22,14,'o');area(1,17,22,5,'a');for(let x of [4,8,14,19])add('palm',x,7);for(let x of [6,16])add('bench',x,14);npc(12,13,'観光客',[['観光客','うわ、日差しが強い！ サングラス持ってきて正解だった。']],'#f5cb76');add('sign',18,4,{solid:false,label:'ゆいレール ↑'})}

function route(tx,ty){tx=Math.max(1,Math.min(MW-2,tx));ty=Math.max(1,Math.min(MH-2,ty));let target={x:tx,y:ty};if(blocked(tx,ty)){let opts=[[tx+1,ty],[tx-1,ty],[tx,ty+1],[tx,ty-1]].filter(([x,y])=>!blocked(x,y));opts.sort((a,b)=>Math.abs(a[0]-player.x)+Math.abs(a[1]-player.y)-Math.abs(b[0]-player.x)-Math.abs(b[1]-player.y));if(!opts.length)return;target={x:opts[0][0],y:opts[0][1]}}let q=[[player.x,player.y]],prev=new Map,seen=new Set([player.x+','+player.y]);while(q.length){let [x,y]=q.shift();if(x===target.x&&y===target.y)break;for(let [dx,dy] of [[1,0],[0,1],[-1,0],[0,-1]]){let nx=x+dx,ny=y+dy,k=nx+','+ny;if(!seen.has(k)&&!blocked(nx,ny)){seen.add(k);prev.set(k,[x,y]);q.push([nx,ny])}}}let k=target.x+','+target.y;if(!seen.has(k))return;let a=[];while(k!==player.x+','+player.y){let [x,y]=k.split(',').map(Number);a.unshift([x,y]);let v=prev.get(k);if(!v)break;k=v.join(',')}path=a}

function sprite(x,y,shirt='#fff2d7',dir=0,walk=0){rect(x+6,y+2,12,7,'#25374b');rect(x+4,y+8,16,12,'#efb98c');rect(x+7,y+13,3,3,'#27394a');rect(x+15,y+13,3,3,'#27394a');if(dir===2){rect(x+5,y+10,15,9,'#26394d')}rect(x+5,y+20,14,9,shirt);rect(x+3,y+21,3,7,'#e7ad86');rect(x+19,y+21,3,7,'#e7ad86');rect(x+6,y+29+(walk%2),5,7,'#335779');rect(x+14,y+29+((walk+1)%2),5,7,'#335779');rect(x+17,y+21,4,7,'#468db0')}
function prop(o,sx,sy){let a=sx,b=sy;switch(o.type){case 'seat':rect(a,b,22,22,'#365c8a');rect(a+2,b+3,18,10,'#557fa9');rect(a+2,b+17,18,4,'#253c63');break;case 'window':rect(a+2,b+2,20,17,'#416b86');rect(a+4,b+4,16,13,'#6dc8dd');rect(a+5,b+14,14,3,'#e8e8cf');break;case 'palm':rect(a+10,b+8,5,20,'#8e673f');for(let i=-2;i<=2;i++)rect(a+9+i*6,b+3+Math.abs(i)*3,11,6,'#3c9c6e');break;case 'plant':rect(a+7,b+15,12,10,'#b76f55');rect(a+5,b+2,16,16,'#4a9871');break;case 'suitcase':rect(a+3,b+5,19,21,o.key==='wrong'?'#3f556e':'#cf6b58');rect(a+10,b+2,6,4,'#283b4d');rect(a+6,b+10,2,12,'#f4d5a0');break;case 'bagbelt':rect(a,b,24,24,'#3e505d');rect(a+2,b+4,20,15,'#7b8991');break;case 'machine':rect(a,b-14,23,37,'#668ca3');rect(a+4,b-9,15,12,'#a7dfe0');rect(a+5,b+7,12,6,'#233e52');break;case 'gate':rect(a,b-7,20,33,'#526c7a');rect(a+3,b-4,14,13,'#5ac6a5');break;case 'counter':rect(a-22,b,70,25,'#49788d');rect(a-18,b+3,62,9,'#a6c6cc');break;case 'poster':rect(a,b-8,23,33,'#d9a957');rect(a+3,b-5,17,23,'#69b6b0');rect(a+6,b+12,12,7,'#e3d4a2');break;case 'bench':rect(a-10,b+5,45,11,'#9b6b45');rect(a-7,b+16,4,10,'#6d5c4a');rect(a+28,b+16,4,10,'#6d5c4a');break;case 'sign':rect(a-13,b-12,65,20,'#266b82');txt(o.label||'EXIT →',a-9,b+1,'#fff',8);break;case 'traindoor':rect(a,b,23,36,'#e4e5d9');rect(a+3,b+3,17,25,'#90c9d4');break;case 'trainwindow':rect(a,b,23,22,'#a0d8e4');rect(a+3,b+4,17,15,'#d3f1ec');break;}}
function render(){g.imageSmoothingEnabled=false;let targetX=player.x*TW-W/2+TW/2,targetY=player.y*TW-H*.49;camX=Math.max(0,Math.min(MW*TW-W,targetX));camY=Math.max(0,Math.min(MH*TW-H,targetY));let bg=chapters[scene].floor;rect(0,0,W,H,bg==='outside'?'#9ed5d6':'#365e75');for(let y=0;y<MH;y++)for(let x=0;x<MW;x++){let a=Math.round(x*TW-camX),b=Math.round(y*TW-camY);if(a>W||b>H||a<-TW||b<-TW)continue;let t=map[y][x],color=t==='#'?'#527385':t==='s'?'#b6c8ce':t==='a'?'#c9d6d0':t==='b'?'#5a7782':t==='o'?'#dfc78e':t==='t'?'#d45d68':t==='y'?'#e8c55c':(x+y)%2?'#e6dec9':'#dcd5bf';rect(a,b,TW,TW,color);if(t==='#'){rect(a,b,TW,4,'#7c9da8');rect(a+3,b+7,3,2,'#60879b')}else if(t==='t'){rect(a+2,b+3,TW-4,8,'#a9dfe4');rect(a+3,b+15,TW-6,3,'#f1e9d4')}else if(t==='o'){rect(a+3,b+3,2,2,'#f2d9a4')}else if(t==='.')rect(a+2,b+2,2,2,'#efe7d4');if(bg==='bridge'&&y===5)rect(a,b,TW,8,'#7bb5c4')}
for(let o of objects)if(o.type!=='empty')prop(o,o.x*TW-camX,o.y*TW-camY);for(let n of npcs)sprite(n.x*TW-camX,n.y*TW-camY-12,n.shirt,0,0);let ex=exit.x*TW-camX,ey=exit.y*TW-camY;rect(ex+2,ey+2,20,20,'#29b8a677');txt('➜',ex+4,ey+19,'#fff',17);sprite(player.x*TW-camX,player.y*TW-camY-12,'#f3f0df',player.dir,player.frame);if(path.length){let [x,y]=path[path.length-1];rect(x*TW-camX+9,y*TW-camY+18,7,3,'#fbe59c')}if(scene===0){rect(5,H-32,150,23,'#102c42c9');txt('✈ NAHA AIRPORT',12,H-17,'#fff',11)}if(scene===4){for(let i=0;i<4;i++){let x=(i*90+tick*.12)%W;rect(x,30+i*24,35,3,'#ffffff55')}}}
function frame(ts){if(!hold)hold=ts;let delta=ts-hold;hold=ts;tick++;if(!lock&&path.length&&delta>=0){step+=delta;if(step>115){step=0;let [nx,ny]=path.shift();player.dir=nx>player.x?1:nx<player.x?3:ny<player.y?2:0;player.x=nx;player.y=ny;player.frame++;if(!path.length&&pending){let fn=pending;pending=null;if(near(exit)||objects.some(o=>near(o))||npcs.some(n=>near(n)))fn()}}}render();requestAnimationFrame(frame)}
function pointer(e){if(talking){nextLine();return}if(lock)return;let r=C.getBoundingClientRect(),sx=(e.clientX-r.left)*W/r.width,sy=(e.clientY-r.top)*H/r.height,tx=Math.floor((sx+camX)/TW),ty=Math.floor((sy+camY)/TW);tapWorld(tx,ty)}C.addEventListener('pointerup',pointer);function resize(){let ratio=innerWidth/innerHeight;W=320;H=Math.max(420,Math.round(320/ratio));C.width=W;C.height=H;g.imageSmoothingEnabled=false}addEventListener('resize',resize);resize();
$('menuButton').onclick=()=>{$('menuInfo').textContent=chapters[scene].name;$('menu').style.display='flex'};$('resume').onclick=()=>$('menu').style.display='none';$('restart').onclick=()=>{if(confirm('最初からやり直しますか？')){flags={};visited={};done=false;build(0);$('menu').style.display='none';say(chapters[0].intro)}};$('again').onclick=()=>{flags={};visited={};done=false;$('credits').style.display='none';build(0);say(chapters[0].intro)};$('start').onclick=()=>{$('title').style.display='none';let saved;try{saved=JSON.parse(localStorage.getItem('churatabi-save'))}catch(e){}if(saved&&Number.isInteger(saved.scene)&&saved.scene>0&&saved.scene<8){flags=saved.flags||{};visited=saved.visited||{};build(saved.scene);say([['システム','前回の旅の続きから再開します。']])}else{build(0);say(chapters[0].intro)}};build(0);requestAnimationFrame(frame);
})();
